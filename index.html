<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Ember Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#dashboard" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="var(--cool)" stroke-width="1.4" stroke-dasharray="2.5 2.5"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="var(--hot)" stroke-width="1.6"/><circle cx="12" cy="12" r="2.4" fill="var(--text)"/></svg>
      <span class="nm" id="siteName">Ember Watch</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#dashboard" data-nav="dashboard"><span class="long">Dashboard</span><span class="short">Home</span></a>
      <a href="#lab" data-nav="lab"><span class="long">Modeling lab</span><span class="short">Lab</span></a>
      <a href="#method" data-nav="method"><span class="long">Methodology</span><span class="short">Method</span></a>
      <a href="#refs" data-nav="refs"><span class="long">References</span><span class="short">Refs</span></a>
    </nav>
    <button class="iconbtn" id="themeBtn" aria-label="Switch colour theme" title="Switch colour theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</header>

<main id="view-dashboard" class="wrap" data-view="dashboard"></main>
<main id="view-lab" class="wrap hidden-view" data-view="lab"></main>
<main id="view-method" class="wrap hidden-view" data-view="method"></main>
<main id="view-refs" class="wrap hidden-view" data-view="refs"></main>

<footer class="foot"><div class="wrap" id="footer"></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/visuals.js"></script>
<script src="js/flame3d.js"></script>
<script src="js/tour.js"></script>
<script src="js/references.js"></script>
<script src="js/app.js"></script>
<script src="js/lab.js"></script>
<script src="js/method.js"></script>
<script>MGFApp.start();</script>
</body>
</html>
